services:
  db:
    image: postgres:17
    container_name: fasapi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hbms_db
      POSTGRES_USER: hbms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hbms_user -d hbms_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
